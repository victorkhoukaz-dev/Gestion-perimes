# GitHub Pages builds main from the repository root.
# Preserve /App/ URLs while excluding private data and development files.
# These exclusions do not remove files from public Git repository history.
exclude:
  - "Archive"
  - "Bases de données csv"
  - "Fichiers de sauvegarde JSON"
  - "Mensuel 2026"
  - "Company Returns - Test Branch"
  - "scratch"
  - "supabase"
  - "docs"
  - "AGENTS.md"
  - "PROJECT.md"
  - "GUIDE_UTILISATION.md"
  - "README.md"
  - "*.bat"
  - "*.ps1"
  - "*.py"
  - "node_modules"
  - "vendor"
  - "Gemfile"
  - "Gemfile.lock"
